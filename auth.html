<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA - ورود</title>
    <link rel="stylesheet" href="css/style.css?v=1789230271">
    <link rel="stylesheet" href="css/auth.css?v=1789230271">
</head>
<body data-theme="neon">
<div id="novaSplash">
  <div class="logo splash-logo"><span>N</span></div>
  <div class="splash-title">NOVA</div>
  <div class="splash-sub">GAME BOOSTER</div>
</div>
<style>
#novaSplash{position:fixed;inset:0;z-index:99999;background:#030509;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease;}
#novaSplash.hide{opacity:0;pointer-events:none;}
.splash-logo{width:110px;height:110px;font-size:52px;margin-bottom:18px;}
.splash-logo::before{inset:4px;}
.splash-logo::after{inset:-8px;border-width:3px;}
.splash-title{font-family:'Orbitron','Segoe UI',sans-serif;font-size:34px;font-weight:900;letter-spacing:6px;text-transform:uppercase;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-sub{color:#8b93a7;font-size:12px;letter-spacing:4px;margin-top:6px;text-transform:uppercase;}
</style>
<script>
(function(){
  var s=document.getElementById('novaSplash');
  function hide(){ if(s){ s.classList.add('hide'); setTimeout(function(){ s.remove(); },500); } }
  window.addEventListener('load', function(){ setTimeout(hide, 900); });
  setTimeout(hide, 3500);
})();
</script>

    <div class="bgAnimated"></div>
    <div class="lines"></div>
    <div class="auth-container">
        <div class="auth-header">
            <!-- آیکون واقعی اپ - همان دایره N صفحه HOME -->
            <div class="logo logo-big">
                <span>N</span>
                
            </div>
            <div class="logo-text">NOVA</div>
            <div class="tagline">GAME BOOSTER</div>
        </div>
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="login">ورود</button>
            <button type="button" class="auth-tab" data-tab="register">ثبت‌نام</button>
        </div>
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label>جیمیل</label>
                <input type="email" id="loginEmail" required placeholder="your@gmail.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <div class="input-with-icon">
                    <input type="password" id="loginPassword" required minlength="6" placeholder="••••••••">
                    <button type="button" class="toggle-pass" data-target="loginPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle class="eye-open" cx="12" cy="12" r="3"/>
                            <line class="eye-closed" x1="1" y1="1" x2="23" y2="23" style="display:none"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="auth-btn">ورود</button>
            <div id="loginError" class="auth-error"></div>
        </form>
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="registerUsername" required minlength="3" placeholder="username">
            </div>
            <div class="form-group">
                <label>جیمیل</label>
                <input type="email" id="registerEmail" required placeholder="your@gmail.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <div class="input-with-icon">
                    <input type="password" id="registerPassword" required minlength="6" placeholder="حداقل ۶ کاراکتر">
                    <button type="button" class="toggle-pass" data-target="registerPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle class="eye-open" cx="12" cy="12" r="3"/>
                            <line class="eye-closed" x1="1" y1="1" x2="23" y2="23" style="display:none"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="auth-btn">ثبت‌نام</button>
            <div id="registerError" class="auth-error"></div>
        </form>
    </div>
    <script type="module">
        import { initSupabase, signIn, signUp } from './js/auth.js';
        try { await initSupabase(); } catch (e) {
            document.querySelectorAll('.auth-error').forEach(el => el.textContent = 'خطا در اتصال: ' + e.message);
        }

        document.querySelectorAll('.auth-tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                document.getElementById(t.dataset.tab + 'Form').classList.add('active');
            });
        });

        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const openPath = btn.querySelector('.eye-open');
                const closedLine = btn.querySelector('.eye-closed');
                if (input.type === 'password') {
                    input.type = 'text';
                    openPath.style.opacity = '0.4';
                    closedLine.style.display = 'block';
                } else {
                    input.type = 'password';
                    openPath.style.opacity = '1';
                    closedLine.style.display = 'none';
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('loginError');
            const btn = e.target.querySelector('.auth-btn');
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = 'در حال ورود...';
            try {
                await signIn(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                location.href = 'index.html';
            } catch (e2) { 
                err.textContent = 'خطا: ' + (e2.message || 'جیمیل یا رمز اشتباه است');
                btn.disabled = false;
                btn.textContent = 'ورود';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('registerError');
            const btn = e.target.querySelector('.auth-btn');
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = 'در حال ثبت‌نام...';
            try {
                await signUp(
                    document.getElementById('registerEmail').value,
                    document.getElementById('registerPassword').value,
                    document.getElementById('registerUsername').value
                );
                location.href = 'index.html';
            } catch (e2) { 
                err.textContent = 'خطا: ' + (e2.message || 'ثبت‌نام ناموفق');
                btn.disabled = false;
                btn.textContent = 'ثبت‌نام';
            }
        });
    </script>
</body>
</html>
