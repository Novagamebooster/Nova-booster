name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean native folders
        run: |
          rm -rf android node_modules www temp_repo

      - name: Copy web assets
        run: |
          mkdir -p www
          cp -r index.html auth.html admin.html manifest.json sw.js www/ 2>/dev/null || true
          cp -r css js icons www/ 2>/dev/null || true
          ls -la www
          test -f www/index.html || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          echo '{"name":"nova-game-booster","version":"3.0.0","private":true}' > package.json
          npm install @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/assets@3.0.5 --save-dev

      - name: Generate neon icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="nG" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00c8ff"/>
                <stop offset="50%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#00ffd1"/>
              </linearGradient>
              <linearGradient id="rG" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="35%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" fill="#030509"/>
            <circle cx="512" cy="512" r="400" fill="none" stroke="url(#rG)" stroke-width="30" opacity="0.9"/>
            <circle cx="512" cy="512" r="360" fill="#030509"/>
            <text x="512" y="670" font-family="Arial Black, sans-serif" font-weight="900" font-size="420" fill="url(#nG)" text-anchor="middle">N</text>
          </svg>
          EOF
          cat << 'EOF' > splash.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
            <defs>
              <linearGradient id="n2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00c8ff"/>
                <stop offset="50%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#00ffd1"/>
              </linearGradient>
              <linearGradient id="r2" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="35%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="nv" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00c8ff"/>
                <stop offset="33%" stop-color="#a855f7"/>
                <stop offset="66%" stop-color="#00ffd1"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
            <rect width="2732" height="2732" fill="#030509"/>
            <g transform="translate(1366, 1050)">
              <circle r="280" fill="none" stroke="url(#r2)" stroke-width="22" opacity="0.9"/>
              <circle r="250" fill="#030509"/>
              <text y="120" font-family="Arial Black, sans-serif" font-weight="900" font-size="300" fill="url(#n2)" text-anchor="middle">N</text>
            </g>
            <text x="1366" y="1580" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" letter-spacing="30" fill="url(#nv)" text-anchor="middle">NOVA</text>
            <text x="1366" y="1680" font-family="Arial, sans-serif" font-weight="700" font-size="50" letter-spacing="18" fill="#8b93a7" text-anchor="middle">GAME BOOSTER</text>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-foreground.png
          rsvg-convert -w 2732 -h 2732 splash.svg -o assets/splash.png
          rsvg-convert -w 2732 -h 2732 splash.svg -o assets/splash-dark.png

      - name: Init Capacitor
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Force fullscreen
        run: |
          cd android
          sed -i 's|<style name="AppTheme"[^>]*>|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowBackground">@android:color/black</item>|' app/src/main/res/values/styles.xml

      - name: Set Play-ready Android target
        run: |
          cd android
          python3 - << 'PY'
          from pathlib import Path
          p = Path('variables.gradle')
          if p.exists():
              s = p.read_text()
              import re
              s = re.sub(r'compileSdkVersion = \d+', 'compileSdkVersion = 36', s)
              s = re.sub(r'targetSdkVersion = \d+', 'targetSdkVersion = 36', s)
              p.write_text(s)
          p2 = Path('app/build.gradle')
          s = p2.read_text()
          if 'compileSdkVersion 36' not in s:
              s = s.replace('android {', 'android {\n    compileSdkVersion 36', 1)
          if 'targetSdkVersion 36' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        targetSdkVersion 36', 1)
          p2.write_text(s)
          PY
          grep -R "compileSdkVersion\|targetSdkVersion" -n variables.gradle app/build.gradle

      - name: Add real WireGuard tunnel core
        run: |
          cd android
          python3 - << 'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'com.wireguard.android:tunnel' not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation 'com.wireguard.android:tunnel:1.0.20260315'\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'", 1)
          if 'coreLibraryDesugaringEnabled true' not in s:
              s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }', 1)
          p.write_text(s)
          PY
          mkdir -p app/src/main/java/com/novagamebooster/app
          cat << 'JAVA' > app/src/main/java/com/novagamebooster/app/BoostCorePlugin.java
          package com.novagamebooster.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.VpnService;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.wireguard.android.backend.GoBackend;
          import com.wireguard.android.backend.Tunnel;
          import com.wireguard.config.Config;
          import com.wireguard.crypto.Key;
          import com.wireguard.crypto.KeyPair;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayInputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          @CapacitorPlugin(name = "BoostCore")
          public class BoostCorePlugin extends Plugin {
              private static final String PREFS = "nova_wireguard";
              private static final String CIPHER_TEXT = "cipher_text";
              private static final String IV = "iv";
              private static final String KS_ALIAS = "NOVA_WG_AES";
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private GoBackend backend;
              private NovaTunnel tunnel;
              private String pendingConfig;

              @Override public void load() {
                  backend = new GoBackend(getContext());
                  tunnel = new NovaTunnel("nova");
              }

              @PluginMethod
              public void getWireGuardPublicKey(PluginCall call) {
                  try {
                      KeyPair pair = getOrCreateKeyPair();
                      JSObject out = new JSObject();
                      out.put("publicKey", pair.getPublicKey().toBase64());
                      out.put("stored", true);
                      call.resolve(out);
                  } catch (Exception e) { call.reject("WireGuard key generation failed", e.getMessage()); }
              }

              @PluginMethod
              public void startVpn(PluginCall call) {
                  JSONObject cfg = call.getObject("config");
                  if (cfg == null) { call.reject("WireGuard config is missing"); return; }
                  try {
                      pendingConfig = cfg.toString();
                      Intent prepare = VpnService.prepare(getActivity());
                      if (prepare != null) { startActivityForResult(call, prepare, "vpnPermissionResult"); return; }
                      connectAsync(call, pendingConfig);
                  } catch (Exception e) { call.reject("VPN preparation failed", e.getMessage()); }
              }

              @ActivityCallback
              private void vpnPermissionResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK) { call.reject("VPN permission was not granted"); return; }
                  connectAsync(call, pendingConfig);
              }

              private void connectAsync(final PluginCall call, final String json) {
                  executor.execute(() -> {
                      try {
                          Config config = Config.parse(new ByteArrayInputStream(buildWgQuickConfig(new JSONObject(json)).getBytes(StandardCharsets.UTF_8)));
                          backend.setState(tunnel, Tunnel.State.UP, config);
                          JSObject ret = new JSObject();
                          ret.put("status", "connected");
                          ret.put("backend", backend.getVersion());
                          call.resolve(ret);
                      } catch (Exception e) { call.reject("WireGuard connection failed", e.getMessage()); }
                  });
              }

              @PluginMethod
              public void stopVpn(PluginCall call) {
                  executor.execute(() -> {
                      try {
                          backend.setState(tunnel, Tunnel.State.DOWN, null);
                          JSObject ret = new JSObject(); ret.put("status", "disconnected"); call.resolve(ret);
                      } catch (Exception e) { call.reject("WireGuard disconnect failed", e.getMessage()); }
                  });
              }

              @PluginMethod
              public void vpnStatus(PluginCall call) {
                  try {
                      JSObject ret = new JSObject();
                      ret.put("connected", backend.getState(tunnel) == Tunnel.State.UP);
                      ret.put("backend", backend.getVersion());
                      call.resolve(ret);
                  } catch (Exception e) { call.reject("VPN status failed", e.getMessage()); }
              }

              @PluginMethod
              public void launchGame(PluginCall call) {
                  String pkgList = call.getString("pkg", ""), keywords = call.getString("keywords", "");
                  JSObject ret = new JSObject();
                  for (String p : pkgList.split(",")) {
                      p = p.trim(); if (p.isEmpty()) continue;
                      Intent launch = getContext().getPackageManager().getLaunchIntentForPackage(p);
                      if (launch != null) { launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getActivity().startActivity(launch); ret.put("launched", true); ret.put("pkg", p); call.resolve(ret); return; }
                  }
                  try {
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null); mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<android.content.pm.ResolveInfo> ris = getContext().getPackageManager().queryIntentActivities(mainIntent, 0);
                      for (String kw : keywords.toLowerCase().split(",")) {
                          kw = kw.trim(); if (kw.length() < 3) continue;
                          for (android.content.pm.ResolveInfo ri : ris) {
                              String pkg = ri.activityInfo.packageName.toLowerCase();
                              String name = ri.loadLabel(getContext().getPackageManager()).toString().toLowerCase();
                              if (pkg.contains(kw) || name.contains(kw)) {
                                  Intent i = new Intent(Intent.ACTION_MAIN); i.addCategory(Intent.CATEGORY_LAUNCHER);
                                  i.setComponent(new android.content.ComponentName(ri.activityInfo.packageName, ri.activityInfo.name));
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getActivity().startActivity(i);
                                  ret.put("launched", true); ret.put("pkg", ri.activityInfo.packageName); call.resolve(ret); return;
                              }
                          }
                      }
                  } catch (Exception ignored) { }
                  ret.put("launched", false); call.resolve(ret);
              }

              @PluginMethod
              public void listInstalledGames(PluginCall call) {
                  JSObject ret = new JSObject(); JSONArray list = new JSONArray();
                  try {
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null); mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<android.content.pm.ResolveInfo> ris = getContext().getPackageManager().queryIntentActivities(mainIntent, 0);
                      for (android.content.pm.ResolveInfo ri : ris) {
                          JSObject obj = new JSObject(); obj.put("pkg", ri.activityInfo.packageName);
                          obj.put("name", ri.loadLabel(getContext().getPackageManager()).toString()); list.put(obj);
                      }
                  } catch (Exception e) { ret.put("error", e.getMessage()); }
                  ret.put("games", list); call.resolve(ret);
              }

              private KeyPair getOrCreateKeyPair() throws Exception {
                  Context c = getContext();
                  android.content.SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String encrypted = p.getString(CIPHER_TEXT, null), ivText = p.getString(IV, null);
                  if (encrypted != null && ivText != null) return new KeyPair(Key.fromBase64(decrypt(encrypted, ivText)));
                  KeyPair pair = new KeyPair();
                  String[] parts = encrypt(pair.getPrivateKey().toBase64());
                  p.edit().putString(CIPHER_TEXT, parts[0]).putString(IV, parts[1]).apply();
                  return pair;
              }

              private SecretKey getOrCreateAesKey() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore"); ks.load(null);
                  if (ks.containsAlias(KS_ALIAS)) return ((KeyStore.SecretKeyEntry) ks.getEntry(KS_ALIAS, null)).getSecretKey();
                  KeyGenerator gen = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                  gen.init(new KeyGenParameterSpec.Builder(KS_ALIAS, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).build());
                  return gen.generateKey();
              }

              private String[] encrypt(String plain) throws Exception {
                  byte[] iv = new byte[12]; new java.security.SecureRandom().nextBytes(iv);
                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding"); cipher.init(Cipher.ENCRYPT_MODE, getOrCreateAesKey(), new GCMParameterSpec(128, iv));
                  return new String[]{Base64.encodeToString(cipher.doFinal(plain.getBytes(StandardCharsets.UTF_8)), Base64.NO_WRAP), Base64.encodeToString(iv, Base64.NO_WRAP)};
              }

              private String decrypt(String encrypted, String ivText) throws Exception {
                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                  cipher.init(Cipher.DECRYPT_MODE, getOrCreateAesKey(), new GCMParameterSpec(128, Base64.decode(ivText, Base64.NO_WRAP)));
                  return new String(cipher.doFinal(Base64.decode(encrypted, Base64.NO_WRAP)), StandardCharsets.UTF_8);
              }

              private String buildWgQuickConfig(JSONObject c) throws Exception {
                  StringBuilder b = new StringBuilder();
                  b.append("[Interface]\nPrivateKey = ").append(getOrCreateKeyPair().getPrivateKey().toBase64()).append("\n");
                  b.append("Address = ").append(c.getString("address")).append("\n");
                  JSONArray dns = c.optJSONArray("dns"); if (dns != null && dns.length() > 0) b.append("DNS = ").append(join(dns)).append("\n");
                  if (c.has("mtu")) b.append("MTU = ").append(c.getInt("mtu")).append("\n");
                  b.append("\n[Peer]\nPublicKey = ").append(c.getString("server_public_key")).append("\n");
                  JSONArray allowed = c.optJSONArray("allowed_ips"); b.append("AllowedIPs = ").append(allowed == null ? "0.0.0.0/0" : join(allowed)).append("\n");
                  b.append("Endpoint = ").append(c.getString("endpoint")).append("\n");
                  b.append("PersistentKeepalive = ").append(c.optInt("persistent_keepalive", 25)).append("\n");
                  return b.toString();
              }

              private String join(JSONArray arr) throws Exception {
                  ArrayList<String> vals = new ArrayList<>(); for (int i = 0; i < arr.length(); i++) vals.add(arr.getString(i)); return String.join(", ", vals);
              }

              private static final class NovaTunnel implements Tunnel {
                  private final String name; NovaTunnel(String name) { this.name = name; }
                  @Override public String getName() { return name; }
                  @Override public void onStateChange(State newState) { }
              }
          }
          JAVA
          cat << 'JAVA' > app/src/main/java/com/novagamebooster/app/MainActivity.java
          package com.novagamebooster.app;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(BoostCorePlugin.class);
              }
          }
          JAVA
          python3 - << 'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          # The WireGuard tunnel AAR ships its own GoBackend$VpnService manifest entry.
          # Do not duplicate it here; Android's manifest merger will include the library service.
          p.write_text(s)
          PY

      - name: Allow package visibility (Android 11+)
        run: |
          cd android
          python3 - << 'PY'
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = """              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """
          if '<queries>' not in s:
              s = s.replace('</manifest>', add + '</manifest>')
          if 'android:allowBackup="false"' not in s:
              s = s.replace('<application', '<application android:allowBackup="false"', 1)
          open(p, 'w').write(s)
          print('=== manifest tail ===')
          print(open(p).read()[-500:])
          PY
          grep -q '<queries>' app/src/main/AndroidManifest.xml && echo '✅ VISIBILITY OK' || { echo '❌ VISIBILITY MISSING'; exit 1; }
          if grep -q 'QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml; then echo '❌ Broad package visibility is not allowed'; exit 1; fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release asset
        run: |
          mkdir -p release
          find . -path ./release -prune -o -name "*.apk" -print0 | xargs -0 -I{} cp {} release/nova-booster.apk
          ls -la release
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOVA Booster - Latest"
          body: "آخرین نسخه خودکار ساخته‌شده توسط CI"
          files: release/nova-booster.apk
