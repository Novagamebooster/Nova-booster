<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - پنل مدیریت</title>
    <link rel="stylesheet" href="css/style.css?v=1789330945">
    <link rel="stylesheet" href="css/admin.css?v=1789330945">
    <style>
        .admin-tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
        .admin-tab { padding: 10px 18px; background: rgba(255,255,255,.05); border: 1px solid #1e293b; border-radius: 10px; color: #94a3b8; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; }
        .admin-tab.active { background: linear-gradient(135deg,#3b82f6,#a855f7); color: white; border-color: transparent; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .pay-card { background: rgba(255,255,255,.03); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .pay-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-approve { background: linear-gradient(135deg,#34d399,#05966d); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; flex: 1; }
        .btn-reject { background: rgba(239,68,68,.2); color: #f87171; border: 1px solid #ef4444; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; }
        .admin-search { width: 100%; padding: 10px; background: #0a0e1a; border: 1px solid #1e293b; border-radius: 10px; color: white; font-family: inherit; margin-bottom: 14px; box-sizing: border-box; }
        .pending-banner { background: linear-gradient(135deg,#f59e0b,#ef4444); color: white; padding: 14px; border-radius: 12px; margin-bottom: 14px; font-weight: 700; text-align: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
    </style>
</head>
<body data-theme="neon">
    <div class="bgAnimated"></div>
    <div class="lines"></div>
    <div class="admin-container">
        <div class="admin-header">
            <a href="index.html" class="back-btn">← بازگشت</a>
            <h1>🛡️ پنل مدیریت NOVA</h1>
            <p class="admin-subtitle">مدیریت کاربران، پرداخت‌ها و اعلان‌ها</p>
        </div>
        <div id="adminAccess" class="admin-access-denied" style="display:none;">
            <div class="denied-icon">🚫</div>
            <h2>دسترسی غیرمجاز</h2>
            <p>فقط مدیر می‌تواند به این صفحه دسترسی داشته باشد.</p>
            <a href="index.html" class="btn-back">بازگشت به اپ</a>
        </div>
        <div id="adminContent" style="display:none;">
            <div id="pendingBanner"></div>
            <div class="admin-stats" id="statsBox"></div>
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="users">👥 کاربران</button>
                <button class="admin-tab" data-tab="payments" id="paymentsTab">💳 پرداخت‌ها</button>
                <button class="admin-tab" data-tab="notifs">🔔 اعلان‌ها</button>
            </div>
            <div id="panel-users" class="admin-panel active">
                <input type="text" class="admin-search" id="usersSearch" placeholder="🔍 جستجوی کاربر (ایمیل، نام)">
                <div class="users-list" id="usersList"></div>
            </div>
            <div id="panel-payments" class="admin-panel">
                <input type="text" class="admin-search" id="paymentsSearch" placeholder="🔍 جستجو (ایمیل یا کد پیگیری)">
                <div id="paymentsList"></div>
            </div>
            <div id="panel-notifs" class="admin-panel">
                <div style="background:rgba(59,130,246,.05);border:1px solid #3b82f6;border-radius:12px;padding:16px;margin-bottom:16px;">
                    <h3 style="color:#60a5fa;margin:0 0 12px;">📢 ارسال اعلان به همه کاربرها</h3>
                    <input type="text" id="notifTitle" placeholder="عنوان (مثال: آپدیت جدید NOVA)" style="width:100%;padding:10px;background:#0a0e1a;border:1px solid #1e293b;border-radius:8px;color:white;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
                    <textarea id="notifBody" rows="4" placeholder="متن پیام..." style="width:100%;padding:10px;background:#0a0e1a;border:1px solid #1e293b;border-radius:8px;color:white;font-family:inherit;margin-bottom:10px;box-sizing:border-box;"></textarea>
                    <button id="sendNotifBtn" style="background:linear-gradient(135deg,#3b82f6,#a855f7);color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:700;font-family:inherit;">ارسال به همه</button>
                </div>
                <div id="notifsList"></div>
            </div>
        </div>
    </div>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        const sb = createClient("https://bpveghqcmxblczvazuff.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmVnaHFjbXhibGN6dmF6dWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTMzNjIsImV4cCI6MjEwNDc4OTM2Mn0.1Cb7NFVETxPCPr9F4hwlNifSKvWDAagYQAGdA_DxMLk");
        async function init() {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) {
                document.getElementById('adminAccess').style.display = 'block';
                return;
            }
            const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', user.id).single();
            if (!profile || profile.is_admin !== true) {
                document.getElementById('adminAccess').style.display = 'block';
                return;
            }
            document.getElementById('adminContent').style.display = 'block';
            document.querySelectorAll('.admin-tab').forEach(t => {
                t.onclick = () => {
                    document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active'));
                    document.querySelectorAll('.admin-panel').forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
                };
            });
            await Promise.all([loadStats(), loadUsers(), loadPayments(), loadNotifs()]);
        }

        async function loadStats() {
            const { count: uc } = await sb.from('profiles').select('*', { count: 'exact', head: true });
            const { count: pc } = await sb.from('payments').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            const { count: ac } = await sb.from('payments').select('*', { count: 'exact', head: true }).eq('status', 'approved');
            const { data: ap } = await sb.from('payments').select('amount').eq('status', 'approved');
            const total = (ap || []).reduce((s, p) => s + (p.amount || 0), 0);
            document.getElementById('statsBox').innerHTML =
                '<div class="stat-card"><div class="stat-value">' + (uc||0) + '</div><div class="stat-label">👥 کاربران</div></div>' +
                '<div class="stat-card"><div class="stat-value">' + (pc||0) + '</div><div class="stat-label">⏳ در انتظار</div></div>' +
                '<div class="stat-card"><div class="stat-value">' + (ac||0) + '</div><div class="stat-label">✅ تأیید شده</div></div>' +
                '<div class="stat-card"><div class="stat-value">' + (total/10000).toLocaleString('fa-IR') + '</div><div class="stat-label">💰 درآمد (هزار ت)</div></div>';
            if (pc > 0) {
                document.getElementById('pendingBanner').innerHTML = '<div class="pending-banner">⏳ ' + pc + ' پرداخت در انتظار تأیید شماست!</div>';
                document.getElementById('paymentsTab').textContent = '💳 پرداخت‌ها (' + pc + ')';
            }
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
            window._users = data || [];
            renderUsers(window._users);
        }
        function renderUsers(list) {
            const box = document.getElementById('usersList');
            if (!list || !list.length) { box.innerHTML = '<div style="text-align:center;color:#64748b;padding:30px;">کاربری نیست</div>'; return; }
            box.innerHTML = list.map(p => {
                const prem = p.plan_expires && new Date(p.plan_expires) > new Date();
                return '<div style="background:rgba(255,255,255,.03);border:1px solid #1e293b;border-radius:12px;padding:14px;margin-bottom:10px;">' +
                    '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><b style="color:#60a5fa;">' + (p.username||p.id.slice(0,8)) + '</b>' + (prem ? '<span style="background:linear-gradient(135deg,#34d399,#a855f7);padding:2px 10px;border-radius:12px;font-size:11px;color:#fff;">👑 پرمیوم</span>' : '') + '</div>' +
                    '<div style="color:#94a3b8;font-size:12px;">📧 ' + (p.email||'-') + '</div>' +
                    '<div style="color:#94a3b8;font-size:12px;">📅 انقضا: ' + (p.plan_expires ? new Date(p.plan_expires).toLocaleDateString('fa-IR') : 'ندارد') + '</div></div>';
            }).join('');
        }

        async function loadPayments() {
            const { data } = await sb.from('payments').select('*').order('created_at', { ascending: false });
            window._pays = data || [];
            renderPayments(window._pays);
        }
        function renderPayments(list) {
            const box = document.getElementById('paymentsList');
            if (!list || !list.length) { box.innerHTML = '<div style="text-align:center;color:#64748b;padding:30px;">پرداختی نیست</div>'; return; }
            const sc = { pending: '#fbbf24', approved: '#34d399', rejected: '#f87171' };
            const sl = { pending: '⏳ در انتظار', approved: '✅ تأیید شده', rejected: '❌ رد شده' };
            box.innerHTML = list.map(p =>
                '<div class="pay-card">' +
                '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><b style="color:#60a5fa;">' + (p.username||'کاربر') + '</b><span style="background:rgba(168,85,247,.2);color:#c4b5fd;padding:2px 10px;border-radius:12px;font-size:12px;">' + p.plan_months + ' ماهه</span></div>' +
                '<div style="color:#cbd5e1;font-size:13px;margin-bottom:4px;">💰 ' + (p.amount||0).toLocaleString('fa-IR') + ' تومان</div>' +
                '<div style="color:#cbd5e1;font-size:13px;margin-bottom:4px;">🔑 کد: <span style="font-family:monospace;color:#fbbf24;background:rgba(251,191,36,.1);padding:2px 8px;border-radius:6px;">' + (p.trace_code||'-') + '</span></div>' +
                '<div style="color:#64748b;font-size:12px;margin-bottom:4px;">📅 ' + new Date(p.created_at).toLocaleString('fa-IR') + '</div>' +
                '<div style="font-size:13px;">وضعیت: <b style="color:' + sc[p.status] + ';">' + sl[p.status] + '</b></div>' +
                (p.status === 'pending' ? '<div class="pay-actions"><button class="btn-approve" onclick="approvePay(\'' + p.id + '\',\'' + p.user_id + '\',' + p.plan_months + ')">✅ تأیید و فعال‌سازی</button><button class="btn-reject" onclick="rejectPay(\'' + p.id + '\')">❌ رد</button></div>' : '') +
                '</div>').join('');
        }

        window.approvePay = async function(id, userId, months) {
            if (!confirm('تأیید پرداخت و فعال‌سازی اشتراک ' + months + ' ماهه؟')) return;
            const exp = new Date();
            exp.setDate(exp.getDate() + months * 30);
            await sb.from('profiles').update({ plan_expires: exp.toISOString() }).eq('id', userId);
            await sb.from('payments').update({ status: 'approved' }).eq('id', id);
            alert('✅ اشتراک فعال شد! انقضا: ' + exp.toLocaleDateString('fa-IR'));
            await Promise.all([loadStats(), loadPayments(), loadUsers()]);
        };
        window.rejectPay = async function(id) {
            if (!confirm('رد این پرداخت؟')) return;
            await sb.from('payments').update({ status: 'rejected' }).eq('id', id);
            await Promise.all([loadStats(), loadPayments()]);
        };

        async function loadNotifs() {
            const { data } = await sb.from('notifications').select('*').order('created_at', { ascending: false });
            const box = document.getElementById('notifsList');
            if (!data || !data.length) { box.innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">اعلانی نیست</div>'; return; }
            box.innerHTML = data.map(n =>
                '<div style="background:rgba(255,255,255,.03);border:1px solid #1e293b;border-radius:12px;padding:14px;margin-bottom:10px;">' +
                '<div style="display:flex;justify-content:space-between;"><b style="color:#60a5fa;">' + n.title + '</b><button onclick="delNotif(\'' + n.id + '\')" style="background:rgba(239,68,68,.2);color:#f87171;border:1px solid #ef4444;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;">حذف</button></div>' +
                '<div style="color:#cbd5e1;font-size:13px;margin-top:6px;">' + (n.body||'') + '</div>' +
                '<div style="color:#64748b;font-size:11px;margin-top:6px;">' + new Date(n.created_at).toLocaleString('fa-IR') + '</div></div>').join('');
        }
        window.delNotif = async function(id) {
            if (!confirm('حذف این اعلان؟')) return;
            await sb.from('notifications').delete().eq('id', id);
            await loadNotifs();
        };
        document.getElementById('sendNotifBtn').onclick = async function() {
            const t = document.getElementById('notifTitle').value.trim();
            const b = document.getElementById('notifBody').value.trim();
            if (!t) { alert('عنوان را وارد کنید'); return; }
            const { error } = await sb.from('notifications').insert({ title: t, body: b });
            if (error) { alert('خطا: ' + error.message); return; }
            alert('✅ اعلان ارسال شد!');
            document.getElementById('notifTitle').value = '';
            document.getElementById('notifBody').value = '';
            await loadNotifs();
        };

        document.getElementById('usersSearch').oninput = e => renderUsers(window._users.filter(u => JSON.stringify(u).toLowerCase().includes(e.target.value.toLowerCase())));
        document.getElementById('paymentsSearch').oninput = e => renderPayments(window._pays.filter(p => JSON.stringify(p).toLowerCase().includes(e.target.value.toLowerCase())));

        init();
    </script>
</body>
</html>
